services:
  companion:
    build: .
    ports:
      - "8745:8745"
    env_file:
      - .env
    volumes:
      # Runtime state — persisted across restarts
      - ./data/utopia:/app/data/utopia
      - ./data/stillness:/app/data/stillness
      - ./data/structures:/app/data/structures
    restart: unless-stopped
