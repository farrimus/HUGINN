<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ship Systems</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0d0f;
    color: #7fb38a;
    font-family: 'Courier New', Courier, monospace;
    font-size: 13px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #header {
    padding: 8px 12px;
    border-bottom: 1px solid #1e2d22;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #4a7a52;
    font-size: 11px;
    letter-spacing: 0.1em;
    flex-shrink: 0;
  }
  #header span { text-transform: uppercase; }
  #minimize-btn {
    cursor: pointer;
    background: none;
    border: 1px solid #1e2d22;
    color: #4a7a52;
    padding: 2px 8px;
    font-family: inherit;
    font-size: 11px;
  }
  #minimize-btn:hover { border-color: #7fb38a; color: #7fb38a; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
  }
  .msg { line-height: 1.5; word-break: break-word; }
  .msg.ai { color: #7fb38a; align-self: flex-start; max-width: 90%; }
  .msg.ai::before { content: '> '; color: #4a7a52; }
  .msg.user { color: #a0c4a8; align-self: flex-end; text-align: right; max-width: 90%; }
  .msg.user::before { content: 'PILOT: '; color: #4a7a52; }
  .msg.error { color: #8b3a3a; align-self: center; font-size: 11px; }
  #status-bar {
    font-size: 10px;
    color: #2d4a32;
    padding: 3px 12px;
    flex-shrink: 0;
    letter-spacing: 0.05em;
  }
  #input-row {
    display: flex;
    border-top: 1px solid #1e2d22;
    padding: 8px;
    gap: 8px;
    flex-shrink: 0;
  }
  #input {
    flex: 1;
    background: #0d1214;
    border: 1px solid #1e2d22;
    color: #7fb38a;
    font-family: inherit;
    font-size: 13px;
    padding: 6px 10px;
    outline: none;
    min-width: 0;
  }
  #input:focus { border-color: #4a7a52; }
  #send-btn {
    background: none;
    border: 1px solid #1e2d22;
    color: #4a7a52;
    font-family: inherit;
    font-size: 11px;
    padding: 6px 14px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    white-space: nowrap;
    flex-shrink: 0;
  }
  #send-btn:hover:not(:disabled) { border-color: #7fb38a; color: #7fb38a; }
  #send-btn:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>
<div id="header">
  <span>SHIP SYSTEMS // ONLINE</span>
  <button id="minimize-btn" onclick="toggleMinimize()">—</button>
</div>
<div id="messages"></div>
<div id="status-bar">READY</div>
<div id="input-row">
  <input id="input" type="text" placeholder="Enter query..." autocomplete="off" />
  <button id="send-btn" onclick="sendMessage()">SEND</button>
</div>

<script>
const TOKEN = '';  // Set to SHIP_TOKEN value if auth is enabled

const params = new URLSearchParams(window.location.search);
const isIngame = params.get('mode') === 'ingame';
if (isIngame) document.getElementById('minimize-btn').style.display = 'none';

let history = [];
let minimized = false;

function toggleMinimize() {
  minimized = !minimized;
  const msgs = document.getElementById('messages');
  const inputRow = document.getElementById('input-row');
  const statusBar = document.getElementById('status-bar');
  msgs.style.display = minimized ? 'none' : 'flex';
  inputRow.style.display = minimized ? 'none' : 'flex';
  statusBar.style.display = minimized ? 'none' : 'block';
  document.getElementById('minimize-btn').textContent = minimized ? '□' : '—';
}

function setStatus(text) {
  document.getElementById('status-bar').textContent = text;
}

function scrollToBottom() {
  const msgs = document.getElementById('messages');
  msgs.scrollTop = msgs.scrollHeight;
}

function addMessage(text, type) {
  const div = document.createElement('div');
  div.className = `msg ${type}`;
  div.textContent = text;
  document.getElementById('messages').appendChild(div);
  scrollToBottom();
  return div;
}

document.getElementById('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !document.getElementById('send-btn').disabled) {
    sendMessage();
  }
});

async function sendMessage() {
  const input = document.getElementById('input');
  const msg = input.value.trim();
  if (!msg) return;

  input.value = '';
  document.getElementById('send-btn').disabled = true;
  addMessage(msg, 'user');
  const aiDiv = addMessage('', 'ai');
  setStatus('PROCESSING...');

  const headers = { 'Content-Type': 'application/json' };
  if (TOKEN) headers['X-Ship-Token'] = TOKEN;

  try {
    const response = await fetch('/chat', {
      method: 'POST',
      headers,
      body: JSON.stringify({ message: msg, history })
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let fullText = '';
    let buffer = '';

    let streamDone = false;
    while (!streamDone) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();  // keep incomplete line in buffer

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6).trim();
        if (payload === '[DONE]') { streamDone = true; break; }
        try {
          const parsed = JSON.parse(payload);
          if (parsed.error) {
            addMessage(parsed.error, 'error');
            setStatus('ERROR');
            streamDone = true;
            break;
          } else if (parsed.text) {
            fullText += parsed.text;
            aiDiv.textContent = fullText;
            scrollToBottom();
          }
        } catch (_) {}
      }
    }

    if (fullText) {
      history.push({ role: 'user', content: msg });
      history.push({ role: 'assistant', content: fullText });
      if (history.length > 40) history = history.slice(-40);
    }

    setStatus('READY');
  } catch (err) {
    addMessage(`COMM ERROR: ${err.message}`, 'error');
    setStatus('ERROR');
  }

  document.getElementById('send-btn').disabled = false;
  document.getElementById('input').focus();
}
</script>
</body>
</html>
